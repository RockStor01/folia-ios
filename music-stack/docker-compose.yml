name: music-stack

# 無損音樂自建棧：slskd (Soulseek P2P) + Lidarr (曲庫管理) + soularr (兩者橋接)
# 用法：cp .env.example .env && docker compose up -d

services:
  slskd:
    image: slskd/slskd:latest
    container_name: slskd
    restart: unless-stopped
    environment:
      - SLSKD_REMOTE_CONFIGURATION=true
      - SLSKD_SLSK_USERNAME=${SLSK_USERNAME:-}
      - SLSKD_SLSK_PASSWORD=${SLSK_PASSWORD:-}
      - SLSKD_NO_AUTH=${SLSKD_NO_AUTH:-false}
      - TZ=${TZ:-Asia/Taipei}
    ports:
      - "5030:5030"   # Web UI / HTTP
      - "5031:5031"   # HTTPS
      - "50300:50300" # Soulseek 監聽埠（P2P 必需，否則只能被動連線）
    volumes:
      - ./data/slskd:/app
      - ./music/downloads:/music/downloads
      - ./music/shared:/music/shared
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5030/health || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3

  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Asia/Taipei}
    ports:
      - "8686:8686"
    volumes:
      - ./data/lidarr:/config
      - ./music:/music

  soularr:
    image: mrusse08/soularr:latest
    container_name: soularr
    restart: unless-stopped
    depends_on:
      - slskd
      - lidarr
    environment:
      - TZ=${TZ:-Asia/Taipei}
    volumes:
      - ./conf/soularr:/data
      - ./music/downloads:/downloads
    # soularr 以 config.ini 驅動，首次啟動前請從 conf/soularr.ini.example 複製一份
    command: ["/app/soularr.py", "--config", "/data/config.ini", "--run-forever"]
